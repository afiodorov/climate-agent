[project]
name = "climate-agent"
version = "0.1.0"
description = "A conversational front-end for the climate comfort ranking, built on LangGraph"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sse-starlette>=3.4.6",
    "redis>=5",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langchain>=1.3.16",
]

[project.scripts]
climate-agent = "climate_agent.main:run"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.24", "ruff>=0.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climate_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["frontend"]
